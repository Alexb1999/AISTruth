[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aistruth-core"
version = "0.1.0"
description = "Truth engine: time sync, spatial helpers, AIS adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aistruth_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
