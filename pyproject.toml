[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "packages/core", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["backend", "packages/core", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["packages/core/tests", "backend/tests"]

