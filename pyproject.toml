[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api", "packages/core", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["apps/api", "packages/core", "scripts"]
