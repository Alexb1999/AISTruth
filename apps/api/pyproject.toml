[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aistruth-api"
version = "0.1.0"
description = "FastAPI service for AISTruth validation and demos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aistruth-core",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aistruth_api*"]
