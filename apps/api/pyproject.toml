[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aistruth-api"
version = "0.1.0"
description = "FastAPI service for AISTruth validation and demos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18",
    "aistruth-core",
    "async-lru>=2.3",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "python-json-logger>=4.1",
    "pydantic-settings>=2.6",
    "slowapi>=0.1",
    "tenacity>=9.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aistruth_api*"]

[tool.uv.sources]
aistruth-core = { path = "../../packages/core", editable = true }
